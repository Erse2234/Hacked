<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Command Processor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Initial black screen */
        #blackOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s;
        }
        #blackOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #blackOverlay span {
            color: #333;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
        }

        /* Fullscreen click trap */
        #fullscreenTrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999998;
            background: rgba(0,0,0,0);
            cursor: pointer;
        }

        /* Main container - 3 windows stacked */
        .container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            opacity: 0;
            animation: appear 0.2s forwards;
            animation-delay: 0.6s;
            z-index: 10;
        }

        @keyframes appear {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Each CMD window */
        .cmd-window {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            overflow: hidden;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.9);
            animation: pop 0.12s ease-out forwards;
            opacity: 0;
        }

        .cmd-window:nth-child(1) { animation-delay: 0.6s; }
        .cmd-window:nth-child(2) { animation-delay: 0.8s; }
        .cmd-window:nth-child(3) { animation-delay: 1.0s; }

        @keyframes pop {
            0% { opacity: 0; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Windows title bar - exact replica */
        .title-bar {
            background: #1a1a1a;
            padding: 3px 10px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            min-height: 24px;
            cursor: default;
        }

        .win-controls {
            display: flex;
            gap: 5px;
            margin-right: 10px;
        }

        .win-btn {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            opacity: 0.15;
            pointer-events: none;
        }
        .win-btn.close { background: #e74c3c; }
        .win-btn.min { background: #f1c40f; }
        .win-btn.max { background: #2ecc71; }

        .title-text {
            color: #c0c0c0;
            font-size: 11px;
            font-family: 'Segoe UI', Arial, sans-serif;
            flex: 1;
        }

        /* Terminal output */
        .terminal {
            background: #0a0a0a;
            padding: 6px 12px 8px 12px;
            font-family: 'Consolas', 'Lucida Console', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.3;
            color: #c0c0c0;
            max-height: 170px;
            min-height: 75px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .terminal::-webkit-scrollbar {
            width: 4px;
            background: #0a0a0a;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: #1a1a1a;
        }

        .line {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 13px;
            line-height: 1.3;
            opacity: 0;
            animation: type 0.02s linear forwards;
        }

        @keyframes type {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Colors - minimal */
        .green { color: #4af626; }
        .red { color: #ff4444; }
        .yellow { color: #e6db74; }
        .gray { color: #808080; }
        .prompt { color: #4af626; }

        /* Progress bar - plain */
        .prog-container {
            margin-top: 4px;
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            padding: 1px;
            display: none;
        }

        .prog-bar {
            height: 14px;
            background: #4af626;
            width: 0%;
            animation: fill 12s ease-in-out forwards;
        }

        @keyframes fill {
            0% { width: 0%; }
            20% { width: 14%; }
            40% { width: 32%; }
            60% { width: 52%; }
            80% { width: 76%; }
            95% { width: 94%; }
            100% { width: 100%; }
        }

        .prog-label {
            color: #666;
            font-size: 11px;
            font-family: 'Consolas', monospace;
            margin-top: 2px;
            display: none;
        }

        /* Final message - simple */
        .final {
            display: none;
            margin-top: 8px;
            padding: 8px;
            border: 1px solid #ff0000;
            background: #0a0000;
            text-align: center;
        }

        .final.show {
            display: block;
            animation: fadeMsg 0.4s ease;
        }

        @keyframes fadeMsg {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .final .big {
            color: #ff0000;
            font-size: 22px;
            font-weight: bold;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .final .skulls {
            font-size: 30px;
            display: block;
            margin-top: 2px;
        }

        .final .sub {
            color: #883333;
            font-size: 12px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* Status bar */
        .status {
            background: #0a0a0a;
            border-top: 1px solid #1a1a1a;
            padding: 2px 12px;
            font-size: 11px;
            color: #555;
            display: flex;
            justify-content: space-between;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            display: inline-block;
            background: #4af626;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }

        @media (max-width: 700px) {
            .container { width: 98%; gap: 4px; }
            .terminal { font-size: 11px; padding: 4px 8px 6px 8px; max-height: 130px; min-height: 55px; }
            .line { font-size: 11px; }
            .title-text { font-size: 10px; }
            .final .big { font-size: 17px; }
            .final .skulls { font-size: 22px; }
        }
    </style>
</head>
<body>

            try {

                else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
                else if (d.msRequestFullscreen) d.msRequestFullscreen();
                fsAttempts++;
            } catch(e) {}
        }

        // Click handler for fullscreen trap
        document.getElementById('fullscreenTrap').addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            goFullscreen();
            document.getElementById('blackOverlay').classList.add('hidden');
            this.style.display = 'none';
        });

        document.getElementById('fullscreenTrap').addEventListener('touchstart', function(e) {
            e.preventDefault();
            e.stopPropagation();
            goFullscreen();
            document.getElementById('blackOverlay').classList.add('hidden');
            this.style.display = 'none';
        });

        // Global click handler
        document.addEventListener('click', function() {
            goFullscreen();
            document.getElementById('blackOverlay').classList.add('hidden');
            document.getElementById('fullscreenTrap').style.display = 'none';
        });

        document.addEventListener('touchstart', function() {
            goFullscreen();
            document.getElementById('blackOverlay').classList.add('hidden');
            document.getElementById('fullscreenTrap').style.display = 'none';
        });

        document.addEventListener('keydown', function() {
            goFullscreen();
            document.getElementById('blackOverlay').classList.add('hidden');
            document.getElementById('fullscreenTrap').style.display = 'none';
        });

        // Aggressive check every 200ms
        setInterval(function() {
            const fs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            if (!fs && fsAttempts < 50) {
                goFullscreen();
            }
        }, 200);

        // On tab switch
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                setTimeout(goFullscreen, 20);
            } else {
                goFullscreen();
            }
        });

        window.addEventListener('blur', function() {
            setTimeout(goFullscreen, 20);
        });

        // ============================================================
        // KEYBOARD LOCKDOWN - COMPLETE

        document.addEventListener('keydown', function(e) {
            const k = e.key;
            const c = e.ctrlKey;
            const a = e.altKey;
            const s = e.shiftKey;

            // Block ALL F keys
            if (k.length === 2 && k[0] === 'F' && !isNaN(k[1])) {
                e.preventDefault(); e.stopPropagation(); return false;
            }

            // Block Escape
            if (k === 'Escape') {
                e.preventDefault(); e.stopPropagation();
                goFullscreen();
                return false;
            }

            // Block Alt combos
            if (a) {
                if (['F4', 'Tab', ' ', 'Enter', 'ArrowLeft', 'ArrowRight'].includes(k)) {
                    e.preventDefault(); e.stopPropagation(); return false;

            }

            // Block Ctrl combos

                e.preventDefault(); e.stopPropagation(); return false;
            }

            // Block F11
            if (k === 'F11') {
                e.preventDefault(); e.stopPropagation();
                goFullscreen();
                return false;
            }

            return true;
        }, true);

            e.preventDefault(); e.stopPropagation(); return false;
        }, true);

        // Block tab close
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
            return '';
        });

        // Block history

            history.pushState(null, null, location.href);
        });
        history.pushState(null, null, location.href);

        // Block copy/paste

        document.addEventListener('paste', function(e) { e.preventDefault(); return false; });
        document.addEventListener('cut', function(e) { e.preventDefault(); return false; });

                term.scrollTop = term.scrollHeight;

                setTimeout(next, 20 + Math.random() * 15);

                            document.body.style.background = '#0a0000';

        // ============================================================
        // START

        // Hide black overlay after 1.5s

        // ============================================================
