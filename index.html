<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Command Processor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* PITCH BLACK - NO TEXT */
        #blackOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 999999;
            transition: opacity 0.1s;
        }
        #blackOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Fullscreen trap */
        #fsTrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999998;
            background: rgba(0,0,0,0);
        }

        .container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
        }

        /* Diagonal overlapping windows */
        .cmd-window {
            position: absolute;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            overflow: hidden;
            width: 65%;
            max-width: 750px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.95);
            pointer-events: none;
            opacity: 0;
        }

        .cmd-window:nth-child(1) {
            top: 5%;
            left: 5%;
            transform: rotate(-2deg);
            animation: pop1 0.15s ease-out forwards;
            animation-delay: 0.3s;
            z-index: 1;
        }

        .cmd-window:nth-child(2) {
            top: 12%;
            left: 12%;
            transform: rotate(1deg);
            animation: pop2 0.15s ease-out forwards;
            animation-delay: 0.5s;
            z-index: 2;
        }

        .cmd-window:nth-child(3) {
            top: 19%;
            left: 19%;
            transform: rotate(-1deg);
            animation: pop3 0.15s ease-out forwards;
            animation-delay: 0.7s;
            z-index: 3;
        }

        @keyframes pop1 {
            0% { opacity: 0; transform: rotate(-2deg) scale(0.92); }
            100% { opacity: 1; transform: rotate(-2deg) scale(1); }
        }

        @keyframes pop2 {
            0% { opacity: 0; transform: rotate(1deg) scale(0.92); }
            100% { opacity: 1; transform: rotate(1deg) scale(1); }
        }

        @keyframes pop3 {
            0% { opacity: 0; transform: rotate(-1deg) scale(0.92); }
            100% { opacity: 1; transform: rotate(-1deg) scale(1); }
        }

        .title-bar {
            background: #1a1a1a;
            padding: 3px 10px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            min-height: 24px;
        }

        .win-controls {
            display: flex;
            gap: 5px;
            margin-right: 10px;
        }

        .win-btn {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            opacity: 0.15;
            pointer-events: none;
        }
        .win-btn.close { background: #e74c3c; }
        .win-btn.min { background: #f1c40f; }
        .win-btn.max { background: #2ecc71; }

        .title-text {
            color: #c0c0c0;
            font-size: 11px;
            font-family: 'Segoe UI', Arial, sans-serif;
            flex: 1;
        }

        /* Terminal - commands scroll here */
        .terminal {
            background: #0a0a0a;
            padding: 6px 12px 8px 12px;
            font-family: 'Consolas', 'Lucida Console', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.3;
            color: #c0c0c0;
            min-height: 280px;
            max-height: 350px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .terminal::-webkit-scrollbar {
            width: 4px;
            background: #0a0a0a;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: #1a1a1a;
        }

        /* Bottom windows blurred */
        .cmd-window:nth-child(1) .terminal {
            opacity: 0.7;
            filter: blur(0.5px);
        }

        .cmd-window:nth-child(2) .terminal {
            opacity: 0.5;
            filter: blur(1px);
        }

        .cmd-window:nth-child(3) .terminal {
            opacity: 1;
            filter: none;
        }

        /* EACH LINE - appears and scrolls */
        .line {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 13px;
            line-height: 1.3;
            opacity: 0;
            animation: typeIn 0.01s linear forwards;
            margin-bottom: 0px;
        }

        @keyframes typeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .green { color: #4af626; }
        .red { color: #ff4444; }
        .yellow { color: #e6db74; }
        .gray { color: #808080; }
        .prompt { color: #4af626; }

        /* Progress */
        .prog-container {
            margin-top: 4px;
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            padding: 1px;
            display: none;
        }

        .prog-bar {
            height: 14px;
            background: #4af626;
            width: 0%;
            animation: fill 12s ease-in-out forwards;
        }

        @keyframes fill {
            0% { width: 0%; }
            20% { width: 14%; }
            40% { width: 32%; }
            60% { width: 52%; }
            80% { width: 76%; }
            95% { width: 94%; }
            100% { width: 100%; }
        }

        .prog-label {
            color: #666;
            font-size: 11px;
            font-family: 'Consolas', monospace;
            margin-top: 2px;
            display: none;
        }

        /* Final message */
        .final {
            display: none;
            margin-top: 8px;
            padding: 8px;
            border: 1px solid #ff0000;
            background: #0a0000;
            text-align: center;
        }

        .final.show {
            display: block;
            animation: fadeMsg 0.4s ease;
        }

        @keyframes fadeMsg {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .final .big {
            color: #ff0000;
            font-size: 22px;
            font-weight: bold;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .final .skulls {
            font-size: 30px;
            display: block;
            margin-top: 2px;
        }

        .final .sub {
            color: #883333;
            font-size: 12px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .status {
            background: #0a0a0a;
            border-top: 1px solid #1a1a1a;
            padding: 2px 12px;
            font-size: 11px;
            color: #555;
            display: flex;
            justify-content: space-between;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            display: inline-block;
            background: #4af626;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }

        @media (max-width: 700px) {
            .cmd-window { width: 80%; }
            .cmd-window:nth-child(1) { top: 2%; left: 2%; }
            .cmd-window:nth-child(2) { top: 8%; left: 8%; }
            .cmd-window:nth-child(3) { top: 14%; left: 14%; }
            .terminal { font-size: 11px; padding: 4px 8px 6px 8px; min-height: 200px; max-height: 250px; }
            .line { font-size: 11px; }
            .title-text { font-size: 10px; }
            .final .big { font-size: 17px; }
            .final .skulls { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- PITCH BLACK - NO TEXT -->
    <div id="blackOverlay"></div>

    <!-- FULLSCREEN TRAP -->
    <div id="fsTrap"></div>

    <div class="container">

        <!-- Window 1 - Background blurred -->
        <div class="cmd-window">
            <div class="title-bar">
                <div class="win-controls">
                    <span class="win-btn close"></span>
                    <span class="win-btn min"></span>
                    <span class="win-btn max"></span>
                </div>
                <div class="title-text">C:\Windows\system32\cmd.exe</div>

                    <span class="win-btn min"></span>
                    <span class="win-btn max"></span>
                </div>
                <div class="title-text">Administrator: C:\Windows\system32\cmd.exe</div>

            <div class="status"><span><span class="dot"></span> Connected</span><span>10.0.0.5</span></div>
        </div>

        <!-- Window 3 - TOP (commands fly here) -->
        <div class="cmd-window">
            <div class="title-bar">
                <div class="win-controls">
                    <span class="win-btn close"></span>
                    <span class="win-btn min"></span>
                    <span class="win-btn max"></span>
                </div>
                <div class="title-text">Administrator: C:\Windows\system32\cmd.exe</div>
            </div>
            <div class="terminal" id="term3">
                <div id="out3"></div>
                <div class="prog-container" id="progBox"><div class="prog-bar" id="progBar"></div></div>

                <div class="final" id="finalMsg">
                    <div class="big">GGS BRO YOU ARE COOKED</div>
                    <span class="skulls">💀💀</span>
                    <div class="sub">Your system has been compromised.</div>
                </div>
            </div>
            <div class="status"><span><span class="dot" style="background:#ff0000;animation-duration:0.3s;"></span> <span id="statusText" style="color:#ff0000;">COMPROMISED</span></span><span>185.165.29.101</span></div>
        </div>

    </div>

    <script>
        // ============================================================
        // FULLSCREEN - EVERY CLICK/KEY
        // ============================================================

        function goFS() {
            const d = document.documentElement;
            try {
                if (d.requestFullscreen) d.requestFullscreen();
                else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
                else if (d.msRequestFullscreen) d.msRequestFullscreen();
            } catch(e) {}
        }

        document.getElementById('fsTrap').addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            goFS();
            document.getElementById('blackOverlay').classList.add('hidden');
            this.style.display = 'none';
        });

        document.getElementById('fsTrap').addEventListener('touchstart', function(e) {
            e.preventDefault();
            e.stopPropagation();
            goFS();
            document.getElementById('blackOverlay').classList.add('hidden');
            this.style.display = 'none';
        });

        document.addEventListener('click', function() {
            goFS();
            document.getElementById('blackOverlay').classList.add('hidden');
            document.getElementById('fsTrap').style.display = 'none';
        });

        document.addEventListener('touchstart', function() {
            goFS();
            document.getElementById('blackOverlay').classList.add('hidden');
            document.getElementById('fsTrap').style.display = 'none';
        });

        document.addEventListener('keydown', function() {
            goFS();
            document.getElementById('blackOverlay').classList.add('hidden');
            document.getElementById('fsTrap').style.display = 'none';
        });

        setInterval(function() {
            const fs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            if (!fs) goFS();
        }, 100);

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) setTimeout(goFS, 10);
            else goFS();
        });

        window.addEventListener('blur', function() {
            setTimeout(goFS, 10);
        });

        // ============================================================
        // KEYBOARD LOCKDOWN - EVERYTHING BLOCKED
        // ============================================================

        document.addEventListener('keydown', function(e) {
            const k = e.key;
            const c = e.ctrlKey;
            const a = e.altKey;

            // Block ALL F keys
            if (k.length === 2 && k[0] === 'F' && !isNaN(k[1])) {
                e.preventDefault(); e.stopPropagation(); return false;
            }

            // Block Escape
            if (k === 'Escape') {
                e.preventDefault(); e.stopPropagation();
                goFS();
                return false;
            }

            // Block ALL Alt
            if (a) {
                e.preventDefault(); e.stopPropagation(); return false;
            }

            // Block ALL Ctrl
            if (c) {
                e.preventDefault(); e.stopPropagation(); return false;
            }

            // Block Windows key
            if (k === 'Meta') {
                e.preventDefault(); e.stopPropagation(); return false;
            }

            // Block F11
            if (k === 'F11') {
                e.preventDefault(); e.stopPropagation();
                goFS();
                return false;
            }

            return true;
        }, true);

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault(); e.stopPropagation(); return false;
        }, true);

        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
            return '';
        });

        window.addEventListener('popstate', function(e) {
            history.pushState(null, null, location.href);
        });
        history.pushState(null, null, location.href);

        document.addEventListener('copy', function(e) { e.preventDefault(); return false; });
        document.addEventListener('paste', function(e) { e.preventDefault(); return false; });
        document.addEventListener('cut', function(e) { e.preventDefault(); return false; });
        document.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
        document.addEventListener('drop', function(e) { e.preventDefault(); return false; });

        // ============================================================
        // COMMANDS - SCROLLING FAST (10-15ms per line)
        // ============================================================

        const commands = [
            { t: 'Microsoft Windows [Version 10.0.19044.1826]' },
            { t: '' },
            { t: 'Microsoft Corporation. All rights reserved.' },
            { t: '' },
            { t: 'C:\\Windows\\system32>whoami', c: 'prompt' },
            { t: 'win10\\administrator' },
            { t: '' },
            { t: 'C:\\Windows\\system32>hostname', c: 'prompt' },
            { t: 'DESKTOP-7F3K2M1' },
            { t: '' },
            { t: 'C:\\Windows\\system32>ipconfig /all | findstr "IPv4"', c: 'prompt' },
            { t: '   IPv4 Address. . . . . . . . . . . : 192.168.1.104' },
            { t: '   IPv4 Address. . . . . . . . . . . : 10.0.0.5' },
            { t: '' },
            { t: 'C:\\Windows\\system32>netsh wlan show profiles', c: 'prompt' },
            { t: '    Profile: "HOME-WIFI-5G"' },
            { t: '    Profile: "OFFICE-GUEST"' },
            { t: '    Profile: "NEIGHBOR-2.4G"' },
            { t: '' },
            { t: 'C:\\Windows\\system32>wmic useraccount get name,sid', c: 'prompt' },
            { t: 'Admin  S-1-5-21-1275210071-1715567821-725345543-500' },
            { t: 'Guest  S-1-5-21-1275210071-1715567821-725345543-501' },
            { t: '' },
            { t: 'C:\\Windows\\system32>tasklist /FI "IMAGENAME eq explorer.exe" /FO TABLE', c: 'prompt' },
            { t: 'explorer.exe   8724 Console  1  1,384,288 K' },
            { t: '' },
            { t: 'C:\\Windows\\system32>netstat -an | findstr "ESTABLISHED"', c: 'prompt' },
            { t: 'TCP    192.168.1.104:49156   185.165.29.101:443   ESTABLISHED' },
            { t: 'TCP    192.168.1.104:49157   185.165.29.101:443   ESTABLISHED' },
            { t: 'TCP    192.168.1.104:49158   185.165.29.101:443   ESTABLISHED' },
            { t: '' },
            { t: 'WARNING: Multiple outbound connections detected on port 443', c: 'red' },
            { t: 'Possible data exfiltration in progress', c: 'red' },
            { t: '' },
            { t: 'C:\\Windows\\system32>netsh advfirewall firewall add rule name="BlockOutbound" dir=out action=block remoteip=185.165.29.101', c: 'prompt' },
            { t: 'Ok.', c: 'green' },
            { t: '' },
            { t: 'C:\\Windows\\system32>ping 185.165.29.101 -n 2', c: 'prompt' },
            { t: 'Pinging 185.165.29.101 with 32 bytes of data:' },
            { t: 'Request timed out.' },
            { t: 'Request timed out.' },
            { t: 'Packets: Sent = 2, Received = 0, Lost = 2 (100% loss)' },
            { t: '' },
            { t: 'Outbound connection blocked successfully', c: 'green' },
            { t: 'System integrity verified', c: 'green' },
            { t: 'All unauthorized access attempts terminated', c: 'green' },
            { t: '' },
            { t: 'C:\\Windows\\system32>', c: 'prompt' },
        ];

        // ============================================================
        // RENDER - SUPER FAST SCROLLING (10-15ms)
        // ============================================================

        function render(output, lines, cb) {
            let i = 0;
            function next() {
                if (i >= lines.length) { 
                    if (cb) cb(); 
                    return; 
                }
                const l = lines[i++];
                const d = document.createElement('div');
                d.className = 'line' + (l.c ? ' ' + l.c : '');
                d.textContent = l.t;
                output.appendChild(d);
                
                // Auto-scroll to bottom so commands appear to "fly up"
                const term = output.parentElement;
                term.scrollTop = term.scrollHeight;
                
                // 10-15ms per line - FAST AS FUCK
                setTimeout(next, 10 + Math.random() * 8);
            }
            next();
        }

        // ============================================================
        // PROGRESS & FINAL
        // ============================================================

        function startProgress() {
            const box = document.getElementById('progBox');
            const label = document.getElementById('progLabel');
            box.style.display = 'block';
            label.style.display = 'block';

            const steps = [
                { p: 5, d: 1000, l: 'Accessing encrypted files... 5%' },
                { p: 20, d: 2500, l: 'Exfiltrating data... 20%' },
                { p: 38, d: 4000, l: 'Establishing persistence... 38%' },
                { p: 58, d: 5500, l: 'Deploying backdoor... 58%' },
                { p: 78, d: 7000, l: 'Encrypting drives... 78%' },
                { p: 95, d: 8500, l: 'Finalizing... 95%' },
                { p: 100, d: 10000, l: 'System compromised.' },
            ];

            steps.forEach(s => {
                setTimeout(() => {
                    label.textContent = s.l;
                    if (s.p === 100) {
                        setTimeout(() => {
                            document.getElementById('finalMsg').classList.add('show');
                            document.getElementById('statusText').textContent = 'COMPROMISED';
                            document.getElementById('statusText').style.color = '#ff0000';
                            document.body.style.background = '#0a0000';
                            setTimeout(() => document.body.style.background = '#000000', 200);
                        }, 300);
                    }
                }, s.d);
            });
        }

        // ============================================================
        // START - PITCH BLACK -> WINDOWS POP -> COMMANDS FLY
        // ============================================================

        let started = false;

        function startEverything() {
            if (started) return;
            started = true;

            // Hide black overlay (no text ever showed)
            document.getElementById('blackOverlay').classList.add('hidden');

            // Start rendering commands in TOP window ONLY
            // Windows pop via CSS at 0.3s, 0.5s, 0.7s
            // Commands start at 0.8s
            setTimeout(() => {
                render(document.getElementById('out3'), commands, () => {
                    setTimeout(startProgress, 400);
                });
            }, 800);
        }

        // Trigger on ANY interaction
        document.addEventListener('click', startEverything);
        document.addEventListener('touchstart', startEverything);
        document.addEventListener('keydown', startEverything);

        // Auto-start after 2.5s if no interaction
        setTimeout(startEverything, 2500);

        // ============================================================
        // KEEP FOCUS
        // ============================================================

        setInterval(() => {
            window.focus();
            const fs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            if (!fs) goFS();
        }, 200);

        console.log('%c⚠️ SECURITY BREACH DETECTED', 'font-size: 16px; color: #ff0000;');
        console.log('Your IP address has been logged.');
    </script>
